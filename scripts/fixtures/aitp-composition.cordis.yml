# Real host dependencies; the driver appends research rows from the shipped bundle and launcher patches.
- name: cordis:llm
- name: cordis:sessions
- name: cordis:projections
- name: cordis:persistence
  config:
    root: './.sessions'
    compression: none
- name: cordis:query
- name: cordis:prompt
- name: cordis:tools
- name: cordis:agents
- name: cordis:loop
  config:
    agents: []
- name: cordis:typert
- name: cordis:policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd() + '/notes'
- name: cordis:mock
