name: AITP validation

on:
  push:
    branches: [main, fix/gpt-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aitp-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_GATE_CONCURRENCY: '1'
      DSH_OXLINT_THREADS: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Select trusted archive baseline
        env:
          AITP_PUSH_BEFORE: ${{ github.event.before }}
          AITP_PR_BASE: ${{ github.event.pull_request.base.sha }}
          AITP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              archive_base="${AITP_PR_BASE:?Pull-request base SHA is missing}"
              ;;
            push)
              archive_base="${AITP_PUSH_BEFORE:?Push before SHA is missing}"
              if [[ "$archive_base" =~ ^0+$ ]]; then
                archive_base=''
              fi
              ;;
            workflow_dispatch)
              archive_base=''
              ;;
            *)
              printf 'Unsupported baseline event: %s\n' "$GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [[ -z "$archive_base" ]]; then
            # New branches and manual runs compare with trusted default-branch history.
            archive_base="$(git merge-base HEAD "refs/remotes/origin/$AITP_DEFAULT_BRANCH")"
            if [[ "$archive_base" == "$(git rev-parse HEAD)" ]]; then
              # A manual run at the default-branch tip must check its last change.
              archive_base="$(git rev-parse --verify "${archive_base}^1")"
            fi
          fi
          archive_base="$(git rev-parse --verify "${archive_base}^{commit}")"
          printf 'DSH_ARCHIVE_BASE_REF=%s\n' "$archive_base" >> "$GITHUB_ENV"
          printf 'Archive baseline: %s\n' "$archive_base"
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build artifacts
        run: pnpm run build:artifacts
      # The ordinary aggregate runner overlaps both programs and pins Host to
      # 4 GiB. These are the same full programs, sequentially, with a 6 GiB cap.
      - name: Check full Host program
        run: node --max-old-space-size=6144 node_modules/typescript/bin/tsc -p tsconfig.host.json
      - name: Check full Client program
        run: node --max-old-space-size=6144 node_modules/typescript/bin/tsc -p tsconfig.client.json
      - name: Check documentation
        run: pnpm run doc-sync
      - name: Check documentation ownership regressions
        run: >-
          pnpm exec vitest run --maxWorkers=1
          scripts/translation-links.spec.ts
          scripts/translation-pairing.spec.ts
          scripts/fork-documentation-scope.spec.ts
          scripts/verify-repository-references.spec.ts
          scripts/verify-concrete-terms.spec.ts
          scripts/doc-standard.spec.ts
      - name: Run keyless GPT reliability regressions
        run: >-
          pnpm exec vitest run --maxWorkers=1
          apps/cli/tests/aitp-headless.spec.ts
          apps/cli/tests/aitp-codex-websocket.spec.ts
          apps/cli/tests/subagent-permissions.spec.ts
          packages/compaction/compaction-basic/tests
          packages/llm/llm-pi-ai/tests/adapter.spec.ts
          packages/llm/llm-pi-ai/tests/codex-responses.spec.ts
          packages/llm/llm-pi-ai/tests/codex-retry.spec.ts
          packages/llm/llm-pi-ai/tests/tool-argument-streaming.spec.ts
