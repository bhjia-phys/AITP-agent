name: AITP validation

on:
  push:
    branches: [main, fix/gpt-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aitp-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_GATE_CONCURRENCY: '1'
      DSH_OXLINT_THREADS: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build artifacts
        run: pnpm run build:artifacts
      # The ordinary aggregate runner overlaps both programs and pins Host to
      # 4 GiB. These are the same full programs, sequentially, with a 6 GiB cap.
      - name: Check full Host program
        run: node --max-old-space-size=6144 node_modules/typescript/bin/tsc -p tsconfig.host.json
      - name: Check full Client program
        run: node --max-old-space-size=6144 node_modules/typescript/bin/tsc -p tsconfig.client.json
      - name: Check documentation
        run: pnpm run doc-sync
      - name: Check documentation ownership regressions
        run: >-
          pnpm exec vitest run --maxWorkers=1
          -t '^(?!.*translation pairing records)'
          scripts/aitp-doc-sync.spec.ts
          scripts/gen-cli-help.spec.ts
          scripts/translation-links.spec.ts
          scripts/translation-pairing.spec.ts
          scripts/fork-documentation-scope.spec.ts
          scripts/verify-repository-references.spec.ts
          scripts/verify-concrete-terms.spec.ts
          scripts/doc-standard.spec.ts
      - name: Run research memory and UI regressions
        run: >-
          pnpm exec vitest run --maxWorkers=1
          packages/research/research-memory/tests
          packages/client/ui-aitp-backend/tests
          packages/client/ui-aitp-research/tests
          packages/client/ui-aitp-session/tests
          packages/client/ui-aitp-fixtures/tests
          packages/client/ui-sidebar-right/tests/service.client.spec.ts
          packages/client/ui-sidebar-right/tests/apply.client.spec.ts
      - name: Install Chromium
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Check built research workspace and production backend in Chromium
        env:
          DSH_SNAPSHOT: replay
        run: >-
          pnpm exec vitest run --config vitest.web.config.ts --maxWorkers=1
          apps/web/tests/aitp-workspace.e2e.ts
          apps/web/tests/aitp-memory.e2e.ts
          apps/web/tests/aitp-onboarding.e2e.ts
          apps/web/tests/native-dock.e2e.ts
          apps/web/tests/library-ui.e2e.ts
          apps/web/tests/native-sources.e2e.ts
          apps/web/tests/workbench.e2e.ts
          apps/web/tests/workbench-ui.e2e.ts
      - name: Run keyless GPT reliability regressions
        run: >-
          pnpm exec vitest run --maxWorkers=1
          apps/cli/tests/aitp-headless.spec.ts
          apps/cli/tests/aitp-codex-websocket.spec.ts
          apps/cli/tests/subagent-permissions.spec.ts
          packages/compaction/compaction-basic/tests
          packages/llm/llm-pi-ai/tests/adapter.spec.ts
          packages/llm/llm-pi-ai/tests/codex-responses.spec.ts
          packages/llm/llm-pi-ai/tests/codex-retry.spec.ts
          packages/llm/llm-pi-ai/tests/tool-argument-streaming.spec.ts

  node-floor-smoke:
    name: Node ${{ matrix.node }} keyless compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - node: '22.22.2'
          - node: '24.15.0'
    env:
      DSH_TELEMETRY_DISABLED: '1'
      VITEST_MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check jsdom storage and observer compatibility
        run: pnpm exec vitest run --maxWorkers=1 scripts/vitest-environment.compat.spec.ts
      - name: Check the real TypeScript language server
        run: >-
          pnpm exec vitest run --config vitest.e2e.config.ts --maxWorkers=1 --retry=0
          packages/lsp/lsp-stdio/tests/typescript-server.e2e.ts
